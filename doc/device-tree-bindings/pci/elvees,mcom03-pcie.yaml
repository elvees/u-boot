%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/elvees,mcom03-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ELVEES MCom-03 PCIe host controller

maintainers:
  - Daniil Stepanov <dstepanov@elvees.com>

description: |+
  ELVEES MCom-03 PCIe host controller is based on the Synopsys DesignWare PCIe
  dual mode controller IP. This is the Root Port part and thus inherits common
  properties defined in snps,dw-pcie.yaml.

allOf:
  - $ref: /schemas/pci/snps,dw-pcie.yaml#

properties:
  compatible:
    const: elvees,mcom03-pcie

  reg:
    items:
      - description: Data Bus Interface (DBI) registers.
      - description: Data Bus Interface 2 (DBI2) for accessing shadow registers.
      - description: iATU memory IO region.
      - description: ELVEES specific application registers.
      - description: PCIe configuration space region.

  reg-names:
    items:
      - const: dbi
      - const: dbi2
      - const: atu
      - const: apb
      - const: config

  device_type:
    description: |
      Indicates that this node is a PCI controller.
    required: true
    enum: [ pci ]

  ranges: true

  dma-ranges: true

  bus-range:
    description: |
      Bus numbers available for this controller.
      This property is used only to state that the given controller has just
      part of the entire configuration space available to it.

  num-lanes:
    description: |
      The number of lanes that supported by the hardware.
      Valid values depend on the device and controller capabilities,
      typically 1, 2 or 4.

  resets:
    description: Should contain platform-specific resets (see the example)

  clocks:
    items:
      - description: Controller Primary clock.
      - description: Auxiliary clock for the controller PMC domain.

  clock-names:
    items:
      - const: core
      - const: aux

required:
  - compatible
  - reg
  - reg-names
  - "#address-cells"
  - "#size-cells"
  - device_type
  - ranges
  - dma-ranges
  - bus-range
  - num-lanes
  - resets
  - clocks
  - clock-names


unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/soc/elvees,mcom03.h>
    #include <dt-bindings/clock/mcom03-clock.h>

    pcie0: pcie@2000000 {
      compatible = "elvees,mcom03-pcie";
      status = "disabled";
      reg = <0x0 0x2000000 0x0 0x100000>,
            <0x0 0x2100000 0x0 0x100000>,
            <0x0 0x2300000 0x0 0x80000>,
            <0x0 0x1a00000 0x0 0x800>,
            <0x0 0x60000000 0x0 0x8000000>;
      reg-names = "dbi", "dbi2", "atu", "apb", "config";
      #address-cells = <3>;
      #size-cells = <2>;
      device_type = "pci";
      ranges = <0x82000000 0x0 0x10000000
          0x0 0x68000000
          0x0 0x8000000>;
      dma-ranges = <0x42000000 0x0 0x40000000
              0x8 0x40000000 0x2 0x80000000>,
             <0x42000000 0x4 0x0
              0xc 0x0 0x1 0x80000000>;
      bus-range = <0x00 0x7f>;
      num-lanes = <4>;
      resets = <&sdr_reset SDR_RST_PCI_ICT>,
         <&sdr_reset SDR_RST_PCI0_BTN>,
         <&sdr_reset SDR_RST_PCI0_PERSTN_PAD>;
      clocks = <&clock CLK_SDR_GATE_PCIE0>,
               <&clock CLK_SDR_UCG0_AUX_PCI>;
      clock-names = "core", "aux";
    };

    pcie1: pcie@2400000 {
      compatible = "elvees,mcom03-pcie";
      status = "disabled";
      reg = <0x0 0x2400000 0x0 0x100000>,
            <0x0 0x2500000 0x0 0x100000>,
            <0x0 0x2700000 0x0 0x80000>,
            <0x0 0x1d00000 0x0 0x800>,
            <0x0 0x70000000 0x0 0x8000000>;
      reg-names = "dbi", "dbi2", "atu", "apb", "config";
      #address-cells = <3>;
      #size-cells = <2>;
      device_type = "pci";
      ranges = <0x82000000 0x0 0x10000000
          0x0 0x78000000
          0x0 0x8000000>;
      dma-ranges = <0x42000000 0x0 0x40000000
              0x8 0x40000000 0x2 0x80000000>,
             <0x42000000 0x4 0x0
              0xc 0x0 0x1 0x80000000>;
      bus-range = <0x00 0x7f>;
      num-lanes = <4>;
      resets = <&sdr_reset SDR_RST_PCI_ICT>,
         <&sdr_reset SDR_RST_PCI1_BTN>,
         <&sdr_reset SDR_RST_PCI1_PERSTN_PAD>;
      clocks = <&clock CLK_SDR_GATE_PCIE1>,
               <&clock CLK_SDR_UCG0_AUX_PCI>;
      clock-names = "core", "aux";
    };
